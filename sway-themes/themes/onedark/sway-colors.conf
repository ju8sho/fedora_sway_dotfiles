# JetBrains / Darcula — qora va sokin ranglar
# Window ranglari shu yerda; vanilla sway bilan mos. (SwayFX effekt satrlari
# olib tashlandi — vanilla ularni xato deb hisoblar edi.)

set $bg              #282C34
set $bg_alt          #2C313A
set $bg_dark         #21252B

set $fg              #ABB2BF
set $fg_dim          #5C6370

set $accent          #D19A66
set $accent_soft     #61AFEF

set $border          #3E4451
set $border_active   #D19A66

client.focused          $border_active $bg_alt $fg $accent $border_active
client.focused_inactive $border       $bg     $fg $border
client.unfocused        $border       $bg_dark $fg_dim $border
client.urgent           #FF6B68       $bg_dark $fg #FF6B68
client.placeholder      $border       $bg_dark $fg_dim $border
client.background       $bg