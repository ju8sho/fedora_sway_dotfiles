# JetBrains / IntelliJ Light — yengil (kun) tema
# Darcula-ish strukturaning yengil variantasi. (SwayFX effekt satrlari
# olib tashlandi — vanilla sway bilan mos.)

set $bg              #F7F7F7
set $bg_alt          #EDEDED
set $bg_dark         #E0E0E0

set $fg              #1E1E1F
set $fg_dim          #5A5A5A

set $accent          #CC7832
set $accent_soft     #3B6EA5

set $border          #C5C5C5
set $border_active   #CC7832

client.focused          $border_active $bg_alt $fg $accent $border_active
client.focused_inactive $border       $bg     $fg $border
client.unfocused        $border       $bg_dark $fg_dim $border
client.urgent           #D23B3B       $bg_dark $fg #D23B3B
client.placeholder      $border       $bg_dark $fg_dim $border
client.background       $bg